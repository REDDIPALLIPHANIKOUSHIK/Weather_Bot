<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="sunGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Background rounded card -->
  <rect width="32" height="32" rx="7.5" fill="url(#bgGradient)" />
  <rect x="0.5" y="0.5" width="31" height="31" rx="7" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1" />

  <!-- Compass Outer Dial -->
  <circle cx="16" cy="16" r="10" fill="none" stroke="rgba(255, 255, 255, 0.45)" stroke-width="1.2" stroke-dasharray="1 1.6" />

  <!-- Sun Orb in background -->
  <circle cx="21" cy="11" r="3.2" fill="url(#sunGradient)" />

  <!-- Stylized Compass / Wind Needle -->
  <!-- North pointer (white) -->
  <polygon points="16,6.5 18.8,16 16,14.5" fill="#ffffff" />
  <polygon points="16,6.5 13.2,16 16,14.5" fill="#e2e8f0" />

  <!-- South pointer (cyan/blue) -->
  <polygon points="16,25.5 18.8,16 16,17.5" fill="#0284c7" />
  <polygon points="16,25.5 13.2,16 16,17.5" fill="#0ea5e9" />

  <!-- Center Pivot Core -->
  <circle cx="16" cy="16" r="2.2" fill="#0f172a" stroke="#ffffff" stroke-width="1" />
</svg>
